<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Test App</title>
</head>
<body>
  <h1>Тестовое приложение</h1>
  <input id="text" type="text" />
  <button onclick="save()">Сохранить</button>

  <script>
    const API = "https://your-service.onrender.com";

    async function load() {
      const res = await fetch(API + "/string");
      const data = await res.json();
      document.getElementById("text").value = data.value;
    }

    async function save() {
      const value = document.getElementById("text").value;
      await fetch(API + "/string", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value })
      });
      alert("Сохранено!");
    }

    //load();
  </script>
</body>
</html>
